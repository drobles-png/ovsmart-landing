<!DOCTYPE html>
<html lang="es" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Título y descripción por ruta: los pone el router (src/content/copy.ts → SEO).
         Estos son los valores de la carga inicial (lo que leen los bots sin JS). -->
    <title>OV S-Mart | Domótica en Guayaquil, Daule y Mocolí</title>
    <meta name="description" content="Automatizamos tu casa o negocio con Alexa, luces, aires, wifi mesh, cámaras y cerraduras. Instalado y funcionando. Visita técnica sin costo." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#061433" />

    <!-- Meta Pixel: lo inyecta vite.config.ts (plugin metaPixel) con META_PIXEL_ID de
         src/config/funnel.ts. Vacío = sin pixel. No carga en localhost. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
    />
    <!-- Saira solo para el wordmark (subset de 6 letras) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@700&text=OV-SMART&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Open Graph. og:image debe ser una URL ABSOLUTA del dominio final (1200x630). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:site_name" content="OV S-Mart" />
    <meta property="og:title" content="OV S-Mart | Apaga la luz sin levantarte de la cama" />
    <meta property="og:description" content="Automatizamos tu casa o negocio con Alexa, luces, aires, wifi mesh, cámaras y cerraduras. Instalado y funcionando. Visita técnica sin costo." />
    <meta property="og:image" content="https://ovsmart-lng.vercel.app/og-image.png" />
    <meta property="og:url" content="https://ovsmart-lng.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
